<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345" role="img" aria-label="A mountain trail with waypoints HTML, CSS and Swift. A climber is on the way up to a summit flag that reads Web developer. Speaks Dutch, English, Portuguese and Spanish." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Sun and clouds -->
  <circle cx="700" cy="62" r="24" fill="#FFC93C"/>
  <circle cx="700" cy="62" r="34" fill="none" stroke="#FFC93C" stroke-opacity=".45" stroke-width="3"/>
  <g fill="#FFFFFF" fill-opacity=".9">
    <ellipse cx="130" cy="70" rx="38" ry="12"/>
    <ellipse cx="152" cy="60" rx="24" ry="12"/>
    <ellipse cx="112" cy="62" rx="16" ry="9"/>
    <ellipse cx="610" cy="34" rx="28" ry="9"/>
    <ellipse cx="626" cy="27" rx="17" ry="9"/>
  </g>

  <!-- Back peaks -->
  <polygon points="30,290 200,130 360,290" fill="#1B6CAE"/>
  <polygon points="200,130 221,152 207,146 196,155 179,152" fill="#FFFFFF"/>
  <polygon points="440,290 600,140 770,290" fill="#1B6CAE"/>
  <polygon points="600,140 623,163 608,156 597,166 577,163" fill="#FFFFFF"/>

  <!-- Main mountain -->
  <polygon points="60,290 400,40 740,290" fill="#0B2A4A"/>
  <polygon points="400,40 740,290 530,290 430,140" fill="#08213B"/>
  <polygon points="400,40 441,70 425,64 410,80 395,66 378,78 359,70" fill="#FFFFFF"/>

  <!-- Ground -->
  <rect x="0" y="290" width="800" height="10" rx="5" fill="#0B2A4A"/>

  <!-- Trail up to the summit -->
  <polyline points="150,278 560,250 270,205 520,170 330,128 450,95 400,50"
            fill="none" stroke="#FFC93C" stroke-width="3.5" stroke-linecap="round"
            stroke-linejoin="round" stroke-dasharray="1 9"/>

  <!-- Waypoints -->
  <g font-size="14" font-weight="800" text-anchor="middle">
    <rect x="528" y="240" width="64" height="26" rx="13" fill="#000000" fill-opacity=".35"/>
    <rect x="525" y="237" width="64" height="26" rx="13" fill="#FFFFFF"/>
    <text x="557" y="255" fill="#0B2A4A">HTML</text>

    <rect x="243" y="195" width="56" height="26" rx="13" fill="#000000" fill-opacity=".35"/>
    <rect x="240" y="192" width="56" height="26" rx="13" fill="#FFFFFF"/>
    <text x="268" y="210" fill="#0B2A4A">CSS</text>

    <rect x="493" y="160" width="64" height="26" rx="13" fill="#000000" fill-opacity=".35"/>
    <rect x="490" y="157" width="64" height="26" rx="13" fill="#FFFFFF"/>
    <text x="522" y="175" fill="#0B2A4A">Swift</text>
  </g>

  <!-- Climber, on the way up between CSS and Swift -->
  <g transform="translate(392,189) scale(1.3)" stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-26" r="4.5" fill="#FFFFFF" stroke="none"/>
    <path d="M-5 -29 A5 4 0 0 1 5 -29 Z" fill="#FFC93C" stroke="none"/>
    <rect x="-9" y="-21" width="6" height="11" rx="2" fill="#FFC93C" stroke="none"/>
    <path d="M0 -21 L0 -9" stroke-width="3.5"/>
    <path d="M0 -9 L-4 0 M0 -9 L5 0" stroke-width="3"/>
    <path d="M0 -18 L8 -11 M8 -11 L12 2" stroke-width="2.5"/>
  </g>

  <!-- Summit flag -->
  <line x1="400" y1="42" x2="400" y2="5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <polygon points="402,5 544,5 530,18.5 544,32 402,32" fill="#FFC93C"/>
  <text x="413" y="24" font-size="15" font-weight="800" fill="#0B2A4A">Web developer</text>

  <!-- Languages -->
  <g text-anchor="middle" font-size="15" font-weight="800">
    <rect x="283" y="311" width="234" height="30" rx="15" fill="#0B2A4A"/>
    <rect x="280" y="307" width="234" height="30" rx="15" fill="#FFC93C"/>
    <text x="397" y="327" fill="#0B2A4A" letter-spacing="1.5">Speaks NL  EN  PT  ES</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
